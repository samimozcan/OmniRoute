name: Build verified v3.8.54 Terra and Cmd K images

on:
  push:
    branches: [feat/v3.8.54-terra-cmdk]
    paths:
      - .github/workflows/docker-v3854-terra-cmdk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-v3854-terra-cmdk
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/samimozcan/omniroute
  DISABLE_SQLITE_AUTO_BACKUP: 'true'
  OMNIROUTE_SKIP_SYSTEM_TRUST: '1'

jobs:
  regression:
    if: github.repository == 'samimozcan/OmniRoute' && github.ref == 'refs/heads/feat/v3.8.54-terra-cmdk'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: ./.github/actions/npm-ci-retry
        with:
          cache: 'false'
      - name: Verify pinned release and the reviewed production tree
        run: |
          set -euo pipefail
          node -e 'require("node:assert/strict").equal(require("./package.json").version, "3.8.54")'
          git fetch --no-tags --depth=1 origin 9c64757b4d8a349fc2f66e7c037d5a447f418254
          git diff --exit-code 9c64757b4d8a349fc2f66e7c037d5a447f418254 HEAD -- open-sse src tests Dockerfile package.json package-lock.json
          test ! -f open-sse/services/usage/openaiAdmin.ts
          test ! -f open-sse/services/usage/openaiRateLimits.ts
          test ! -f .github/workflows/fork-provider-resource-image.yml
          git diff --check
      - name: Core TypeScript and compatibility regressions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verification"
          npm run typecheck:core > "$RUNNER_TEMP/verification/typecheck.log" 2>&1 || { cat "$RUNNER_TEMP/verification/typecheck.log"; exit 1; }
          node --import tsx/esm --import ./open-sse/utils/setupPolyfill.ts --import ./tests/_setup/isolateDataDir.ts --test --test-force-exit \
            tests/unit/openai-canonical-effort-18912.test.ts \
            tests/unit/effort-thinking-standardization-6241.test.ts \
            tests/unit/chatcore-upstream-body.test.ts \
            tests/unit/translator-strip-client-metadata-1157.test.ts \
            tests/unit/gpt5-tools-reasoning-guard.test.ts \
            tests/unit/gpt5-sampling-guard.test.ts \
            tests/unit/gpt6-luna-tools-reasoning-16440.test.ts \
            tests/unit/openai-reporting-retirement.test.ts \
            tests/unit/provider-specific-data-secrets-response.test.ts \
            tests/unit/provider-specific-data-secrets-at-rest.test.ts \
            tests/unit/provider-specific-secrets-16836.test.ts \
            tests/unit/provider-specific-secrets-db-16836.test.ts \
            > "$RUNNER_TEMP/verification/node.log" 2>&1 || { tail -n 200 "$RUNNER_TEMP/verification/node.log"; exit 1; }
          tail -n 12 "$RUNNER_TEMP/verification/node.log"
          node node_modules/vitest/vitest.mjs run --config vitest.config.ts --maxWorkers=2 tests/unit/ui/command-palette-frequency.test.tsx tests/unit/ui/command-palette-kit.test.tsx > "$RUNNER_TEMP/verification/ui.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/verification/ui.log"; exit 1; }
          tail -n 12 "$RUNNER_TEMP/verification/ui.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: v3854-image-regression
          path: ${{ runner.temp }}/verification
          retention-days: 14

  broad-tests:
    name: Full npm test on ${{ matrix.source }}
    if: github.repository == 'samimozcan/OmniRoute' && github.ref == 'refs/heads/feat/v3.8.54-terra-cmdk'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        source: [release, candidate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.source == 'release' && '1c880c5c95b3f0240d5e4c6c8f0947ec46b5d25e' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: ./.github/actions/npm-ci-retry
        with:
          cache: 'false'
      - name: Run the unchanged repository test command with a bounded wall clock
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/broad"
          git rev-parse HEAD > "$RUNNER_TEMP/broad/source-sha.txt"
          timeout --signal=TERM --kill-after=30s 18m npm test > "$RUNNER_TEMP/broad/npm-test.log" 2>&1
          result=$?
          echo "$result" > "$RUNNER_TEMP/broad/exit-code.txt"
          tail -n 100 "$RUNNER_TEMP/broad/npm-test.log"
          printf 'Full npm test exit: %s. Exit 124 means incomplete timeout, not success.\n' "$result" >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: v3854-broad-${{ matrix.source }}
          path: ${{ runner.temp }}/broad
          retention-days: 14
          if-no-files-found: warn

  build:
    name: Native build and restart smoke ${{ matrix.arch }}
    needs: regression
    if: github.repository == 'samimozcan/OmniRoute' && github.ref == 'refs/heads/feat/v3.8.54-terra-cmdk'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the unchanged release Dockerfile with reviewed source
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          target: runner-base
          platforms: ${{ matrix.platform }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
            OMNIROUTE_BUILD_WORKERS=2
          labels: |
            org.opencontainers.image.source=https://github.com/samimozcan/OmniRoute
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=3.8.54-terra-cmdk-${{ github.sha }}
          tags: ${{ env.IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=terra-cmdk-${{ matrix.arch }}
          cache-to: type=gha,scope=terra-cmdk-${{ matrix.arch }},mode=max,ignore-error=true
      - name: Verify architecture revision startup and the same disposable volume after restart
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          container="omniroute-v3854-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${BUILD_ARCH}"
          volume="${container}-data"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker pull "$image_ref"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_ref")" = "$EXPECTED_PLATFORM"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_ref")" = "$GITHUB_SHA"
          docker volume create "$volume" >/dev/null
          start_and_wait() {
            docker run --detach --name "$container" --stop-timeout 40 \
              --mount "type=volume,source=${volume},target=/app/data" \
              -e OMNIROUTE_DISABLE_CREDENTIAL_HEALTH_CHECK=1 "$image_ref"
            for attempt in $(seq 1 90); do
              health=$(docker inspect --format '{{.State.Health.Status}}' "$container")
              state=$(docker inspect --format '{{.State.Status}}' "$container")
              if [ "$health" = healthy ]; then return 0; fi
              if [ "$health" = unhealthy ] || [ "$state" != running ]; then docker logs "$container"; return 1; fi
              sleep 2
            done
            docker logs "$container"
            return 1
          }
          start_and_wait
          docker exec --env "SOURCE_SHA=${GITHUB_SHA}" "$container" node -e 'require("node:fs").writeFileSync("/app/data/terra-cmdk-smoke.txt",process.env.SOURCE_SHA)'
          docker stop -t 40 "$container" >/dev/null
          docker rm "$container" >/dev/null
          start_and_wait
          docker exec --env "SOURCE_SHA=${GITHUB_SHA}" "$container" node -e 'require("node:assert/strict").equal(require("node:fs").readFileSync("/app/data/terra-cmdk-smoke.txt","utf8"),process.env.SOURCE_SHA)'
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/digests/${BUILD_ARCH}"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/digests/${BUILD_ARCH}-source"
          printf 'Verified %s image digest `%s`, source `%s`, healthy startup and volume reuse. No release tags or deployment.\n' "$EXPECTED_PLATFORM" "$IMAGE_DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v3854-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 14
