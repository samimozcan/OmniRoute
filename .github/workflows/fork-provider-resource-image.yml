name: Cancel PR4 provider-resource images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fork-provider-resource-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  packages: write

concurrency:
  group: cancel-pr4-provider-resources
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'samimozcan/OmniRoute' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require cancelled unmerged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/samimozcan/OmniRoute/pulls/4 --jq '.state == "closed" and .merged == false' | grep -qx true
      - name: Delete exact PR4 versions and verify unrelated images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          """One-time PR4 package cleanup. No repository checkout or deployment access."""
          import hashlib
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          
          PREFIX = '3.8.53-provider-resources-'
          PACKAGE = '/users/samimozcan/packages/container/omniroute/versions'
          EXPECTED = {
              1563615678: ('sha256:41c92ca6420f75ccf388e986f92b72231d07827ae4652f1cc0b21b4157ba23ae', ['3.8.53-provider-resources-3ef1bf674c9f']),
              1563607278: ('sha256:011a720297b8e853528c8a10fb75702839182a973486c971f28dc7d48cc58c81', ['3.8.53-provider-resources-3ef1bf674c9f3426fdf726a183d7ad4c4c973faf']),
              1563615632: ('sha256:311f3006ea433703e775eb973d9077b74a2de9e27793d6c45d09deabeeebae1b', []),
              1563615579: ('sha256:22effcb47bda1e36293deb7f8cc93bf83eef483e06a694da5d3ff63253b3d37f', []),
              1563615516: ('sha256:56ba6d236c66a506909a3acae3c0423373239198e6aa0dd6d2fb067cf85b9b4c', []),
              1563615416: ('sha256:e826ac27f4ad8fcd7f943be6a5c0217efa349c31c5d477780a48ef46b0479503', []),
              1563607233: ('sha256:3c305f874f0edb04d79381b59f79b417bff5e6ad892a699a19cdefee7262f8aa', []),
              1563607183: ('sha256:936e70ca9d2c8247e79c2852d7480905ebf525a1218691468a34fcb1a5903b58', []),
              1563607129: ('sha256:336fbb6588b4976116f313b5d95c5ee1aea7c2d677032409036b12600064c0ca', []),
              1563607031: ('sha256:4d61f56c94f259f556f3c5636c9b63fbe092b766b6f35d3d51bb29caacc2983e', []),
          }
          
          
          def tags(v):
              return sorted(v['metadata']['container']['tags'])
          
          
          def refs(manifest):
              result = {item['digest'] for item in manifest.get('manifests', [])}
              if manifest.get('subject'):
                  result.add(manifest['subject']['digest'])
              return result
          
          
          def plan_deletions(versions, manifests, expected):
              by_id = {v['id']: v for v in versions}
              if len(by_id) != len(versions):
                  raise ValueError('Duplicate package version IDs')
              if set(manifests) != {v['name'] for v in versions}:
                  raise ValueError('Incomplete manifest inventory')
              target_digests = {digest for digest, _ in expected.values()}
              roots = set()
              for i, (digest, expected_tags) in expected.items():
                  v = by_id.get(i)
                  if not v or v['name'] != digest or tags(v) != sorted(expected_tags):
                      raise ValueError('Target identity or tags changed: ' + str(i))
                  if expected_tags:
                      if not all(t.startswith(PREFIX) for t in expected_tags):
                          raise ValueError('Non-target root tag')
                      roots.add(digest)
              reachable, pending = set(), list(roots)
              while pending:
                  digest = pending.pop()
                  if digest in reachable:
                      continue
                  if digest not in target_digests:
                      raise ValueError('Target references a manifest outside exact allowlist')
                  reachable.add(digest)
                  pending.extend(refs(manifests[digest]) - reachable)
              if reachable != target_digests:
                  raise ValueError('An untagged version is not proven to belong to target roots')
              for v in versions:
                  if v['id'] in expected:
                      continue
                  if any(t.startswith(PREFIX) for t in tags(v)):
                      raise ValueError('An unexpected provider-resource version needs review')
                  if refs(manifests[v['name']]) & target_digests:
                      raise ValueError('Protected version shares a target manifest')
              return sorted((by_id[i] for i in expected), key=lambda v: (not bool(tags(v)), v['id']))
          
          
          def api(path, method='GET'):
              req = Request('https://api.github.com' + path, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'OmniRoute-PR4-cancellation',
              })
              with urlopen(req, timeout=30) as response:
                  if method == 'DELETE':
                      if response.status != 204:
                          raise RuntimeError('Unexpected deletion status')
                      return None
                  return json.load(response)
          
          
          def list_versions():
              result = []
              for page in range(1, 21):
                  batch = api(PACKAGE + '?per_page=100&state=active&page=' + str(page))
                  if not isinstance(batch, list):
                      raise RuntimeError('Invalid version list')
                  result.extend(batch)
                  if len(batch) < 100:
                      return result
              raise RuntimeError('Pagination bound reached; nothing may be deleted')
          
          
          def registry_manifest(digest, token):
              req = Request('https://ghcr.io/v2/samimozcan/omniroute/manifests/' + digest, headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json',
                  'Cache-Control': 'no-cache',
              })
              with urlopen(req, timeout=30) as response:
                  raw = response.read(2 * 1024 * 1024 + 1)
                  if len(raw) > 2 * 1024 * 1024:
                      raise RuntimeError('Manifest is too large')
                  if 'sha256:' + hashlib.sha256(raw).hexdigest() != digest:
                      raise RuntimeError('Registry digest mismatch')
                  return json.loads(raw)
          
          
          def main():
              if os.environ.get('GITHUB_REPOSITORY') != 'samimozcan/OmniRoute':
                  raise RuntimeError('Wrong repository')
              pr = api('/repos/samimozcan/OmniRoute/pulls/4')
              if pr['state'] != 'closed' or pr['merged']:
                  raise RuntimeError('PR4 must be closed without merge')
              before = list_versions()
              # Anonymous read-only token is used only for this public registry package.
              with urlopen('https://ghcr.io/token?service=ghcr.io&scope=repository:samimozcan/omniroute:pull', timeout=30) as response:
                  registry_token = json.load(response)['token']
              manifests = {v['name']: registry_manifest(v['name'], registry_token) for v in before}
              plan = plan_deletions(before, manifests, EXPECTED)
              print('VALIDATED_PLAN ' + json.dumps([{'id': v['id'], 'digest': v['name'], 'tags': tags(v)} for v in plan]), flush=True)
              protected = {v['id']: (v['name'], tags(v)) for v in before if v['id'] not in EXPECTED}
              # Validate every target again before the first destructive request.
              for v in plan:
                  current = api(PACKAGE + '/' + str(v['id']))
                  if current['name'] != v['name'] or tags(current) != tags(v):
                      raise RuntimeError('Concurrent target update; refusing deletion')
              for v in plan:
                  api(PACKAGE + '/' + str(v['id']), method='DELETE')
                  print('DELETED ' + str(v['id']) + ' ' + v['name'], flush=True)
              after = list_versions()
              after_by_id = {v['id']: (v['name'], tags(v)) for v in after}
              if set(EXPECTED) & set(after_by_id):
                  raise RuntimeError('Some target versions remain active')
              if any(any(t.startswith(PREFIX) for t in tags(v)) for v in after):
                  raise RuntimeError('Provider-resource tags remain')
              if any(after_by_id.get(i) != identity for i, identity in protected.items()):
                  raise RuntimeError('Protected version inventory changed')
              for v in before:
                  if v['id'] not in EXPECTED and tags(v):
                      registry_manifest(v['name'], registry_token)
              print('VERIFIED ' + json.dumps({'deleted_versions': len(plan), 'protected_versions_unchanged': len(protected), 'remaining_active_versions': len(after)}), flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write('PR4 cancellation: deleted ' + str(len(plan)) + ' validated package versions (2 image indexes and their 8 private-to-these-images platform/attestation manifests). Preserved ' + str(len(protected)) + ' unrelated versions and verified their tagged manifests remain readable. No images published, no runtime code changed, no deployment or volume access.\n')
          
          
          if __name__ == '__main__':
              main()
          PY
