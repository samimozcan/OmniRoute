name: Fork isolated provider-resource image
# Re-trigger after repository Actions were re-enabled by owner (2026-11-14).

on:
  push:
    branches: [feat/provider-file-cache-routing]
    paths:
      - ".github/workflows/fork-provider-resource-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-provider-resource-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'samimozcan/OmniRoute'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate only to fork GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish isolated immutable tag
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner-base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/samimozcan/omniroute:3.8.53-provider-resources-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/samimozcan/OmniRoute
          cache-from: type=gha,scope=provider-resources
          cache-to: type=gha,mode=max,scope=provider-resources
      - name: Record published digest
        run: |
          echo "Image: ghcr.io/samimozcan/omniroute:3.8.53-provider-resources-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Existing tags and deployments are not changed." >> "$GITHUB_STEP_SUMMARY"
