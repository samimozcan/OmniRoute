name: Cancel PR4 provider-resource images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fork-provider-resource-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  packages: read

concurrency:
  group: cancel-pr4-provider-resources
  cancel-in-progress: false

jobs:
  inventory:
    if: github.repository == 'samimozcan/OmniRoute' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require cancelled unmerged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/samimozcan/OmniRoute/pulls/4 --jq '.state == "closed" and .merged == false' | grep -qx true
      - name: Inventory package versions without deleting or publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate '/users/samimozcan/packages/container/omniroute/versions?per_page=100&state=active' --jq '.[] | {id, name, tags: .metadata.container.tags}'
