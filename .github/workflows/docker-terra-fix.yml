name: Publish GPT Terra fix image

on:
  push:
    branches: [fix/gpt-terra-effort-18912]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-terra-fix-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/samimozcan/omniroute

jobs:
  regression:
    name: Verify OpenAI reasoning regression
    if: >-
      github.repository == 'samimozcan/OmniRoute' &&
      github.ref == 'refs/heads/fix/gpt-terra-effort-18912'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DISABLE_SQLITE_AUTO_BACKUP: "true"
      OMNIROUTE_SKIP_SYSTEM_TRUST: "1"
    steps:
      - name: Check out the fix commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the supported test runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install and verify locked dependencies
        uses: ./.github/actions/npm-ci-retry
        with:
          cache: "false"

      # The new regression captures the actual DefaultExecutor fetch body for
      # direct and priority-combo dispatch without using live provider credentials.
      - name: Run the regression and adjacent request tests
        run: >-
          node --import tsx/esm
          --import ./open-sse/utils/setupPolyfill.ts
          --import ./tests/_setup/isolateDataDir.ts
          --test --test-force-exit
          tests/unit/openai-canonical-effort-18912.test.ts
          tests/unit/effort-thinking-standardization-6241.test.ts
          tests/unit/chatcore-upstream-body.test.ts
          tests/unit/translator-strip-client-metadata-1157.test.ts
          tests/unit/gpt5-tools-reasoning-guard.test.ts
          tests/unit/gpt5-sampling-guard.test.ts
          tests/unit/gpt6-luna-tools-reasoning-16440.test.ts

  build:
    name: Build and smoke-test ${{ matrix.arch }}
    needs: regression
    if: >-
      github.repository == 'samimozcan/OmniRoute' &&
      github.ref == 'refs/heads/fix/gpt-terra-effort-18912'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Sign in to the fork's container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build each architecture natively. The stable release's publish workflow
      # uses a 12 GiB webpack heap on the public 16 GiB hosted runners.
      # Only unnamed digests are pushed here; pull tags are created after both
      # architectures pass their native startup and volume-reuse smoke checks.
      - name: Build the production image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          target: runner-base
          platforms: ${{ matrix.platform }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
            OMNIROUTE_BUILD_WORKERS=2
          labels: |
            org.opencontainers.image.source=https://github.com/samimozcan/OmniRoute
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=3.8.52-terra-18912-${{ github.sha }}
          tags: ${{ env.IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=terra-fix-${{ matrix.arch }}
          cache-to: type=gha,scope=terra-fix-${{ matrix.arch }},mode=max,ignore-error=true

      - name: Check native startup and reuse a disposable data volume
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          container="omniroute-terra-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume="${container}-data"

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker pull "$image_ref"
          actual_platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_ref")
          test "$actual_platform" = "$EXPECTED_PLATFORM"
          docker volume create "$volume" >/dev/null

          start_and_wait() {
            docker run --detach --name "$container" \
              --stop-timeout 40 \
              --mount "type=volume,source=${volume},target=/app/data" \
              -e OMNIROUTE_DISABLE_CREDENTIAL_HEALTH_CHECK=1 \
              "$image_ref"

            for attempt in $(seq 1 60); do
              health=$(docker inspect --format '{{.State.Health.Status}}' "$container")
              state=$(docker inspect --format '{{.State.Status}}' "$container")
              if [ "$health" = "healthy" ]; then
                return 0
              fi
              if [ "$health" = "unhealthy" ] || [ "$state" != "running" ]; then
                docker logs "$container"
                return 1
              fi
              sleep 2
            done
            docker logs "$container"
            return 1
          }

          start_and_wait
          docker exec --env "SOURCE_SHA=${GITHUB_SHA}" "$container" node -e \
            'require("node:fs").writeFileSync("/app/data/terra-fix-smoke.txt", process.env.SOURCE_SHA)'
          docker stop -t 40 "$container" >/dev/null
          docker rm "$container" >/dev/null
          start_and_wait
          docker exec --env "SOURCE_SHA=${GITHUB_SHA}" "$container" node -e \
            'require("node:assert/strict").equal(require("node:fs").readFileSync("/app/data/terra-fix-smoke.txt", "utf8"), process.env.SOURCE_SHA)'

      - name: Record the verified digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/terra-digests"
          printf '%s\n' "$IMAGE_DIGEST" > "${RUNNER_TEMP}/terra-digests/${BUILD_ARCH}"

      - name: Upload the verified digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: terra-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/terra-digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the verified multi-platform tags
    needs: build
    if: >-
      github.repository == 'samimozcan/OmniRoute' &&
      github.ref == 'refs/heads/fix/gpt-terra-effort-18912'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download both verified digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: terra-digest-*
          path: ${{ runner.temp }}/terra-digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Sign in to the fork's container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and verify the multi-platform image
        run: |
          set -euo pipefail
          read -r amd64_digest < "${RUNNER_TEMP}/terra-digests/amd64"
          read -r arm64_digest < "${RUNNER_TEMP}/terra-digests/arm64"
          [[ "$amd64_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$arm64_digest" =~ ^sha256:[a-f0-9]{64}$ ]]

          version="3.8.52-terra-18912-${GITHUB_SHA:0:12}"
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${version}" \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            "${IMAGE_NAME}@${amd64_digest}" \
            "${IMAGE_NAME}@${arm64_digest}"

          docker buildx imagetools inspect --raw "${IMAGE_NAME}:${version}" \
            | jq -e '[.manifests[].platform | select(.os == "linux") | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'

          # Advance the fork-only convenience channel after manifest verification.
          # The upstream image and its latest tag are never modified.
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:terra-18912" "${IMAGE_NAME}:${version}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${version}"

          {
            printf '### GPT Terra fix image\n\n'
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Platforms: `linux/amd64`, `linux/arm64`\n\n'
            printf '```bash\ndocker pull %s:%s\n```\n\n' "$IMAGE_NAME" "$version"
            printf 'Commit tag: `%s:sha-%s`\n\n' "$IMAGE_NAME" "$GITHUB_SHA"
            printf 'Convenience channel: `%s:terra-18912`\n\n' "$IMAGE_NAME"
            printf 'GHCR packages are private on first publication. For anonymous pulls, set this package to public in its package settings; otherwise authenticate to GHCR before pulling.\n'
          } >> "$GITHUB_STEP_SUMMARY"
